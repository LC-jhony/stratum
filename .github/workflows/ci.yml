name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, tests, architecture and build
    runs-on: ubuntu-latest
    env:
      # The CI job never launches Electron; skip the ~100 MB binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint the Linux installer
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -S warning scripts/install.sh
      - run: npm run typecheck
      - run: npm run lint:arch
      - run: npm test
      - run: npm run build
