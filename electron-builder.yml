appId: dev.stratum.app
productName: Stratum
# No runtime native modules: SQLite is WASM and ssh2's cpu-features is optional.
npmRebuild: false
directories: { output: dist, buildResources: stratum-brand/build }   # icon.png / icon.ico / icon.icns / icons/*
files: ["out/**", "package.json"]
asarUnpack: ["node_modules/sql.js/dist/*.wasm"]
extraResources:
  - { from: themes, to: themes }
  - { from: resources/jdbc-adapter, to: jdbc-adapter }   # populated by `npm run fetch:jdbc`
  - { from: stratum-brand/png/stratum-512.png, to: icons/stratum-512.png }      # BrowserWindow icon (Linux) + About panel
  - { from: stratum-brand/tray/tray-32.png, to: icons/tray-32.png }             # tray, Windows/Linux
  - { from: stratum-brand/tray/trayTemplate.png, to: icons/trayTemplate.png }   # tray, macOS (Electron picks up the @2x next to it)
  - { from: stratum-brand/tray/trayTemplate@2x.png, to: icons/trayTemplate@2x.png }
mac:  { category: public.app-category.developer-tools, target: [dmg, zip], hardenedRuntime: true }
win:  { target: [nsis, portable] }
linux:
  target: [AppImage, deb, rpm]
  category: Development
  desktop:
    entry: { StartupWMClass: stratum }
# electron-builder's default deb list still hard-depends on libxss1, but the packaged Electron
# binary neither links nor dlopens libXss.so.1 (verified with readelf/ldd), so requiring it
# only breaks `dpkg -i` on distros that no longer ship it (e.g. Ubuntu 26.04). Keep it as a
# recommendation. The depends list below mirrors the 25.1.8 defaults minus libxss1.
deb:
  depends: [libgtk-3-0, libnotify4, libnss3, libxtst6, xdg-utils, libatspi2.0-0, libuuid1, libsecret-1-0]
  recommends: [libappindicator3-1, libxss1]
  afterInstall: scripts/linux/after-install.tpl
rpm:
  afterInstall: scripts/linux/after-install.tpl
# afterInstall overrides electron-builder's stock post-install script. The stock one probes user
# namespaces as root (where the probe always passes) and then leaves chrome-sandbox at 0755; on
# Ubuntu 24.04+ (kernel.apparmor_restrict_unprivileged_userns=1) the real user cannot use the
# namespace sandbox, so Electron aborts at startup unless the helper is setuid root. See
# scripts/linux/after-install.tpl.
